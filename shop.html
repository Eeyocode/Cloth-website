<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | CrownWears</title>
  <meta name="description" content="Browse every CrownWears piece: oversized tees, hoodies, polos, shorts and jackets.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="reveal">
        <p class="eyebrow">CrownWears</p>
        <h1>Shop the full drop</h1>
        <p>Browse easy everyday pieces, clean streetwear staples, and comfortable fits made for repeat wear.</p>
      </div>
      <div class="page-hero-media reveal" style="--reveal-delay:120ms" aria-hidden="true">
        <img src="images/hoodie7.jpeg" alt="">
        <img src="images/t-shirt3.jpeg" alt="">
      </div>
    </section>

    <section class="shop-toolbar" aria-label="Shop controls">
      <div>
        <label for="shop-search">Search products</label>
        <input type="search" id="shop-search" placeholder="Search hoodies, polos, shorts..." autocomplete="off">
      </div>
      <div class="shop-sort">
        <label for="sort-products">Sort by</label>
        <select id="sort-products">
          <option value="featured">Featured</option>
          <option value="price-low">Price: low to high</option>
          <option value="price-high">Price: high to low</option>
          <option value="name">Name</option>
        </select>
      </div>
    </section>

    <section class="filters" aria-label="Product categories">
      <button type="button" class="active" data-filter="all">All</button>
      <button type="button" data-filter="tshirt">T-Shirts</button>
      <button type="button" data-filter="hoodie">Hoodies</button>
      <button type="button" data-filter="polo">Polos</button>
      <button type="button" data-filter="shorts">Shorts</button>
      <button type="button" data-filter="jacket">Jackets</button>
    </section>

    <section class="shop-results">
      <div class="shop-meta">
        <p id="result-count" aria-live="polite">Showing all products</p>
        <p>Free Lagos delivery on orders above &#8358;50,000</p>
      </div>
      <div class="grid" id="product-grid"></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="script.js"></script>
</body>
</html>
