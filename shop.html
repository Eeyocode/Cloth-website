<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shop | CrownWear Collections</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="header">
    <nav class="navbar">
      <div class="menu-toggle">&#9776;</div>
      <img src="images/logo.png" alt="CrownWear Logo" class="logo-image" />

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html" class="active">Shop</a></li>
        <li><a href="new-arrivals.html">New Arrivals</a></li>
        <li><a href="#">Contact</a></li>
      </ul>

      <div class="nav-icons">
        <a href="cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
      </div>
    </nav>
  </header>

  <section class="shop-header">
    <h2>Shop</h2>
    <p>Home / Shop</p>
  </section>

  <section class="filters">
    <button>All</button>
    <button>Men</button>
    <button>Women</button>
    <button>Hoodies</button>
    <button>T-Shirts</button>
  </section>

  <section class="featured">
    <div class="product-grid" id="product-grid"></div>
  </section>

  <footer class="footer">
    <div class="footer-container">
      <div class="footer-col">
        <h3>CrownWear</h3>
        <p>Modern fashion pieces designed for everyday confidence and style.</p>
      </div>
      <div class="footer-col">
        <h4>Shop</h4>
        <a href="shop.html">All Products</a>
        <a href="new-arrivals.html">New Arrivals</a>
        <a href="#">Best Sellers</a>
      </div>
      <div class="footer-col">
        <h4>Support</h4>
        <a href="#">Contact</a>
        <a href="#">Shipping</a>
        <a href="#">Returns</a>
      </div>
    </div>
    <p class="copyright">© 2026 CrownWear Collections</p>
  </footer>

  <script src="script.js"></script>
  <script>
    // Render shop products dynamically
    const productGrid = document.getElementById("product-grid");

    products.forEach(p => {
      const a = document.createElement("a");
      a.href = `product.html?id=${p.id}`;
      a.className = "product-card";
      a.innerHTML = `
        <img src="${p.image}" alt="${p.name}">
        <h3>${p.name}</h3>
        <p>₦${p.price}</p>
      `;
      productGrid.appendChild(a);
    });
  </script>
</body>
</html>
