<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | CrownWears Collections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <h1 class="page-title">Your cart</h1>

    <div class="cart-layout">
      <div id="cart-items"></div>

      <aside class="summary-card hidden" id="cart-summary" aria-label="Cart total">
        <h3>Cart total</h3>
        <div class="summary-row"><span>Subtotal</span><span data-total="subtotal"></span></div>
        <div class="summary-row"><span>Delivery</span><span data-total="delivery"></span></div>
        <p class="free-note" id="free-note"></p>
        <div class="free-bar" id="free-bar"><span></span></div>
        <div class="summary-row total"><span>Total</span><span data-total="total"></span></div>
        <a href="checkout.html" class="btn btn-primary btn-block">Proceed to checkout</a>
        <a href="shop.html" class="btn btn-block">Continue shopping</a>
      </aside>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="script.js"></script>
</body>
</html>
