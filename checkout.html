<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | CrownWears Collections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>

  <main id="checkout-root">
    <h1 class="page-title">Checkout</h1>

    <div class="checkout-layout">
      <form class="form-card" id="checkout-form" novalidate>
        <h3>Billing details</h3>
        <div class="form-grid">
          <div class="full">
            <label for="fullname">Full name</label>
            <input id="fullname" name="fullname" type="text" autocomplete="name" required>
          </div>
          <div>
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div>
            <label for="phone">Phone number</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" required>
          </div>
          <div class="full">
            <label for="address">Address</label>
            <input id="address" name="address" type="text" autocomplete="street-address" required>
          </div>
          <div>
            <label for="city">City</label>
            <input id="city" name="city" type="text" autocomplete="address-level2" required>
          </div>
          <div>
            <label for="state">State</label>
            <select id="state" name="state" autocomplete="address-level1" required>
              <option value="">Select state</option>
              <option>Abia</option><option>Adamawa</option><option>Akwa Ibom</option><option>Anambra</option>
              <option>Bauchi</option><option>Bayelsa</option><option>Benue</option><option>Borno</option>
              <option>Cross River</option><option>Delta</option><option>Ebonyi</option><option>Edo</option>
              <option>Ekiti</option><option>Enugu</option><option>FCT (Abuja)</option><option>Gombe</option>
              <option>Imo</option><option>Jigawa</option><option>Kaduna</option><option>Kano</option>
              <option>Katsina</option><option>Kebbi</option><option>Kogi</option><option>Kwara</option>
              <option>Lagos</option><option>Nasarawa</option><option>Niger</option><option>Ogun</option>
              <option>Ondo</option><option>Osun</option><option>Oyo</option><option>Plateau</option>
              <option>Rivers</option><option>Sokoto</option><option>Taraba</option><option>Yobe</option>
              <option>Zamfara</option>
            </select>
          </div>
        </div>
      </form>

      <aside class="summary-card" aria-label="Your order">
        <h3>Your order</h3>
        <div id="order-lines"></div>
        <div class="summary-row"><span>Subtotal</span><span data-total="subtotal"></span></div>
        <div class="summary-row"><span>Delivery</span><span data-total="delivery"></span></div>
        <div class="summary-row total"><span>Total</span><span data-total="total"></span></div>
        <button class="btn btn-primary btn-block" type="submit" form="checkout-form">Place order</button>
        <a href="cart.html" class="btn btn-block">Back to cart</a>
      </aside>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="script.js"></script>
</body>
</html>
